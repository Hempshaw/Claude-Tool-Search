name: Weekly AI tools digest

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC (10:00 UK summer time, 09:00 winter)
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to save seen_tools.json back to the repo

jobs:
  post-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and post digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided automatically, nothing to set up
        run: python digest.py

      - name: Save list of already-featured tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add seen_tools.json
          git diff --cached --quiet || (git commit -m "Update featured tools list" && git push)
